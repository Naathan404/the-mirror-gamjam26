<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | %UNITY_WEB_NAME%</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        border: 0;
        background: #231F20;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      #unity-container {
        position: relative;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #231F20;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #231F20;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=%UNITY_WIDTH% height=%UNITY_HEIGHT% tabindex="-1"></canvas>
    </div>
    <script src="Build/%UNITY_LOADER_FILENAME%"></script>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.style.position = "fixed";
        container.style.top = "0";
        container.style.left = "0";
      }

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/%UNITY_DATA_FILENAME%",
        frameworkUrl: "Build/%UNITY_FRAMEWORK_FILENAME%",
        codeUrl: "Build/%UNITY_CODE_FILENAME%",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "%UNITY_COMPANY_NAME%",
        productName: "%UNITY_PRODUCT_NAME%",
        productVersion: "%UNITY_PRODUCT_VERSION%",
        matchWebGLToCanvasSize: true, // keep internal render resolution synced to the CSS-scaled display size
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
